aid: everledger
name: Everledger
description: >-
  Everledger is a supply-chain transparency company that uses a private,
  enterprise blockchain plus IoT to create tamper-evident digital identities
  ("digital twins") for physical assets and to track their provenance from origin
  to market. Its platform spans diamonds, coloured gemstones, wine and spirits,
  art, fashion and luxury goods, critical minerals, batteries and insurance. The
  developer surface is the Everledger Platform API (marketed as "Amplify") — a
  suite of REST APIs including the Provenance API (a full, media-rich provenance
  report for any object), the Object API (verify an object's identity against its
  digital twin) and the Transfer API (reassign ownership of a digital asset on the
  blockchain when a sale is made) — plus an embeddable Amplify Widget for
  eCommerce. Access is via the invite-only Everledger Developer Community (EDC).
  Founded by Leanne Kemp and backed by Bloomberg Beta, the company restructured in
  2023 and continues to operate on its core gems, minerals and textiles markets.
