apis:
- name: Everledger Platform API (Amplify)
  description: >-
    The Everledger Platform API — marketed as Amplify — is a suite of REST APIs
    that let organizations access and embed blockchain-backed provenance data in
    their own systems. Core APIs include the Provenance API (complete, datestamped,
    media-rich provenance report for any object), the Object API (verify an
    object's identity via its digital twin) and the Transfer API (record immutable
    transfers of ownership on the blockchain). Access is gated through the
    invite-only Everledger Developer Community.
